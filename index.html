<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumer Culture - Vocabulario</title>
<style>
  :root {
    --cream: #F4FBF7;
    --coral: #E23744;
    --orange: #E8C34A;
    --navy: #0B2E1D;
    --deepblue: #0B2E1D;
    --teal: #E8C34A;
    --maroon: #8E1B22;
    --night: #06180F;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(232,195,74,0.08) 0, transparent 30%),
      radial-gradient(circle at 85% 75%, rgba(226,55,68,0.08) 0, transparent 30%),
      linear-gradient(180deg, var(--night), #0A1F15 60%, #06160E);
    color: var(--navy);
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 2.5rem 2rem;
    position: relative;
    overflow-x: hidden;
  }
  .snow-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .snowflake {
    position: absolute;
    top: -10px;
    color: #FFFFFF;
    text-shadow: 0 0 6px rgba(255,255,255,0.7);
    animation-name: fall, sway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes fall {
    to { transform: translateY(110vh); }
  }
  @keyframes sway {
    0%, 100% { margin-left: 0; }
    50% { margin-left: 30px; }
  }
  body > *:not(.snow-layer) {
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 6px;
    color: #F4FBF7;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--teal);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 2rem;
  }
  .card {
    max-width: 1100px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,43,91,0.10);
    padding: 10px 28px;
    border-top: 5px solid var(--coral);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0 40px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #D9EEE1;
  }
  .en-wrap {
    flex: 1;
    min-width: 0;
  }
  .en {
    font-size: 20px;
    font-weight: 600;
    display: block;
    color: var(--deepblue);
  }
  .phon {
    font-size: 18px;
    color: var(--orange);
    font-style: italic;
    display: block;
  }
  .es {
    font-size: 20px;
    color: #8E1B22;
    flex: 1;
    min-width: 0;
  }
  button.play {
    width: 28px;
    height: 28px;
    padding: 0;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: var(--coral);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button.play:hover {
    background: var(--orange);
    transform: scale(1.06);
  }

  /* ---- Reproductor secuencial ---- */
  .player {
    max-width: 1100px;
    margin: 0 auto 1.75rem;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,43,91,0.10);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-top: 5px solid var(--navy);
  }
  .player-btn {
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    background: var(--navy);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .player-btn:hover {
    background: var(--deepblue);
    transform: scale(1.06);
  }
  .player-btn.main {
    width: 48px;
    height: 48px;
    background: var(--coral);
    font-size: 17px;
  }
  .player-btn.main:hover {
    background: var(--orange);
  }
  .player-info {
    flex: 1;
    min-width: 0;
  }
  .player-word {
    font-size: 15px;
    font-weight: 700;
    color: var(--deepblue);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-progress-track {
    height: 4px;
    background: #D9EEE1;
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
  }
  .player-progress-fill {
    height: 100%;
    background: var(--coral);
    width: 0%;
    transition: width 0.2s ease;
  }
  .player-count {
    font-size: 12px;
    color: #2E7A4F;
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* ---- Modo celular ---- */
  @media (max-width: 700px) {
    .player { padding: 12px 14px; gap: 10px; border-radius: 14px; }
    .player-btn { width: 42px; height: 42px; font-size: 16px; }
    .player-btn.main { width: 52px; height: 52px; font-size: 19px; }
    .player-word { font-size: 15px; }
    .player-count { font-size: 11px; }
    body { padding: 1.5rem 1rem; }
    h1 { font-size: 20px; }
    .subtitle { font-size: 12px; margin-bottom: 1.25rem; }
    .card { padding: 6px 16px; border-radius: 14px; }
    .grid { grid-template-columns: 1fr; gap: 0; }
    .row { padding: 16px 0; gap: 14px; }
    .en { font-size: 20px; }
    .phon { font-size: 18px; margin-top: 3px; }
    .es { font-size: 20px; margin-top: 3px; }
    button.play { width: 42px; height: 42px; font-size: 19px; }
  }
</style>
</head>
<body>

<div class="snow-layer" id="snowLayer"></div>

<h1>🎄 Consumer Culture 🎁</h1>
<div class="subtitle">Vocabulario · Inglés / Español</div>

<div class="player">
  <button class="player-btn" id="prevBtn" aria-label="Anterior">&#9664;&#9664;</button>
  <button class="player-btn main" id="playBtn" aria-label="Reproducir todo">&#9654;</button>
  <button class="player-btn" id="nextBtn" aria-label="Siguiente">&#9654;&#9654;</button>
  <div class="player-info">
    <div class="player-word" id="playerWord">Reproducir todo el vocabulario (inglés → español)</div>
    <div class="player-progress-track">
      <div class="player-progress-fill" id="playerProgress"></div>
    </div>
  </div>
  <div class="player-count" id="playerCount">0 / 44</div>
</div>

<div class="card">
  <div class="grid" id="grid"></div>
</div>

<script>
const data = [
["to afford","poder costear","afórd"],
["to browse","curiosear / mirar","bráus"],
["to consume","consumir","konsiúm"],
["to display","exhibir","displéi"],
["to examine","examinar","eksámin"],
["to influence","influenciar","ínfluens"],
["to interact","interactuar","interákt"],
["to overspend","gastar de más","óuverspend"],
["to purchase","comprar","pérchas"],
["to queue","hacer fila","kiú"],
["to refund","reembolsar","rifánd"],
["to socialize","socializar","sóushalais"],
["to spend","gastar","spend"],
["to tempt","tentar","tempt"],
["to window-shop","mirar vitrinas","uíndou shap"],
["bargain","ganga / oferta","bárgain"],
["boutique","boutique","butík"],
["brand","marca","brand"],
["consumer","consumidor","konsiúmer"],
["discount","descuento","dískaunt"],
["display","exhibición","displéi"],
["escalator","escalera eléctrica","éskaleitor"],
["goods","mercancía","guds"],
["mall","centro comercial","mol"],
["merchandise","mercancía","mérchandais"],
["purchase","compra","pérchas"],
["retailer","minorista","rítailer"],
["shopper","comprador","shóper"],
["storefront","fachada de tienda","stórfront"],
["trend","tendencia","trend"],
["affordable","asequible","afórdabol"],
["commercial","comercial","komérshal"],
["crowded","lleno / concurrido","kráudid"],
["discounted","con descuento","dískaunted"],
["exclusive","exclusivo","eksklúsiv"],
["fashionable","Aura o Estilo","fáshonabol"],
["impulsive","impulsivo","impálsiv"],
["materialistic","materialista","materialístik"],
["retail","al por menor","rítail"],
["trendy","de moda","tréndi"],
["affordably","de manera asequible","afórdabli"],
["carelessly","descuidadamente","kérlesli"],
["commercially","comercialmente","komérshali"],
["heavily","fuertemente","jévili"],
["impulsively","impulsivamente","impálsivli"]
];

const cols = 3, rows = 15;
const grid = document.getElementById('grid');

for (let c = 0; c < cols; c++) {
  const col = document.createElement('div');
  for (let r = 0; r < rows; r++) {
    const [en, es, phon] = data[c * rows + r];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <button class="play" aria-label="Escuchar ${en}" data-word="${en}">&#128266;</button>
      <span class="en-wrap">
        <span class="en">${en}</span>
        <span class="phon">${phon}</span>
      </span>
      <span class="es">${es}</span>
    `;
    col.appendChild(row);
  }
  grid.appendChild(col);
}

grid.addEventListener('click', e => {
  const btn = e.target.closest('button[data-word]');
  if (!btn) return;
  const utter = new SpeechSynthesisUtterance(btn.dataset.word);
  utter.lang = 'en-US';
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
});

// ---- Reproductor secuencial (inglés -> español, todo el vocabulario) ----
const total = data.length;
let playerIndex = 0;
let playerPhase = 'en'; // 'en' o 'es'
let isPlaying = false;

const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playerWord = document.getElementById('playerWord');
const playerProgress = document.getElementById('playerProgress');
const playerCount = document.getElementById('playerCount');

function updatePlayerUI() {
  const [en, es] = data[playerIndex];
  playerWord.textContent = playerPhase === 'en' ? en : (en + '  →  ' + es);
  playerCount.textContent = (playerIndex + 1) + ' / ' + total;
  playerProgress.style.width = (((playerIndex) / total) * 100) + '%';
}

function speakPlayer(text, lang, onEnd) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.onend = () => { if (isPlaying) onEnd(); };
  speechSynthesis.speak(u);
}

function playStep() {
  if (playerIndex >= total) {
    stopPlayer();
    playerIndex = 0;
    playerPhase = 'en';
    updatePlayerUI();
    return;
  }
  updatePlayerUI();
  const [en, es] = data[playerIndex];
  if (playerPhase === 'en') {
    speakPlayer(en, 'en-US', () => {
      playerPhase = 'es';
      playStep();
    });
  } else {
    speakPlayer(es, 'es-ES', () => {
      playerPhase = 'en';
      playerIndex++;
      playStep();
    });
  }
}

function startPlayer() {
  isPlaying = true;
  playBtn.innerHTML = '&#10074;&#10074;';
  playBtn.setAttribute('aria-label', 'Pausar');
  playStep();
}

function stopPlayer() {
  isPlaying = false;
  speechSynthesis.cancel();
  playBtn.innerHTML = '&#9654;';
  playBtn.setAttribute('aria-label', 'Reproducir todo');
}

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    stopPlayer();
  } else {
    startPlayer();
  }
});

prevBtn.addEventListener('click', () => {
  speechSynthesis.cancel();
  playerPhase = 'en';
  playerIndex = Math.max(0, playerIndex - 1);
  updatePlayerUI();
  if (isPlaying) playStep();
});

nextBtn.addEventListener('click', () => {
  speechSynthesis.cancel();
  playerPhase = 'en';
  playerIndex = Math.min(total - 1, playerIndex + 1);
  updatePlayerUI();
  if (isPlaying) playStep();
});

updatePlayerUI();

// ---- Copos de nieve cayendo ----
const snowLayer = document.getElementById('snowLayer');
const snowChars = ['❄', '❅', '❆'];
const snowCount = 45;

for (let i = 0; i < snowCount; i++) {
  const flake = document.createElement('span');
  flake.className = 'snowflake';
  flake.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];
  const size = 10 + Math.random() * 20;
  flake.style.left = Math.random() * 100 + 'vw';
  flake.style.fontSize = size + 'px';
  flake.style.opacity = 0.4 + Math.random() * 0.6;
  const fallDuration = 8 + Math.random() * 12;
  const swayDuration = 3 + Math.random() * 4;
  flake.style.animationDuration = fallDuration + 's, ' + swayDuration + 's';
  flake.style.animationDelay = (-Math.random() * fallDuration) + 's, ' + (-Math.random() * swayDuration) + 's';
  snowLayer.appendChild(flake);
}
</script>

</body>
</html>
